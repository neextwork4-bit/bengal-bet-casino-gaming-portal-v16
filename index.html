    <script>
      // Intercept and cleanly handle Vite HMR WebSocket in preview iframe/cloud sandbox
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            try {
              // If it's a vite HMR websocket connection
              if (typeof url === 'string' && (url.includes('vite') || url.includes('ws') || url.startsWith('ws:') || url.startsWith('wss:'))) {
                var ws = new OriginalWebSocket(url, protocols);
                ws.addEventListener('error', function(e) {
                  // Suppress unhandled error bubbles
                  e.stopImmediatePropagation && e.stopImmediatePropagation();
                });
                return ws;
              }
              return new OriginalWebSocket(url, protocols);
            } catch (err) {
              // Return a dummy safe socket that fails gracefully without throwing unhandled rejections
              var dummy = {
                readyState: 3,
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; }
              };
              return dummy;
            }
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }

        // Global unhandledrejection & error suppression for WebSocket closed events
        window.addEventListener('unhandledrejection', function(event) {
          var str = '';
          try {
            str = (event.reason && (event.reason.message || event.reason.stack || String(event.reason))) || '';
          } catch(e) {}
          if (str.toLowerCase().indexOf('websocket') !== -1 || str.toLowerCase().indexOf('ws') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var str = '';
          try {
            str = (event && (event.message || String(event))) || '';
          } catch(e) {}
          if (str.toLowerCase().indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
